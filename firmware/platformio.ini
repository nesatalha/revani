; Revani — ESP32-S3 gidon ekranı
; Kart: Waveshare ESP32-S3-LCD-2.8C (16 MB flash, 8 MB PSRAM, 480x480 ST7701 RGB)
;
; Arayüz kodu ui/ altında; LVGL simülatörü (simulator/) ile ortak.

[platformio]
default_envs = revani
src_dir = src

[env:revani]
; TODO (1.2.2'den önce): Arduino core 3.x / ESP-IDF 5.x'e geç (pioarduino platformu).
; RGB panelde bounce buffer ve PSRAM'den XIP, BLE/flash işlemleri sırasında ekran
; kaymasını önler; Waveshare demoları da core 3.x. Denendi, disk dolu olduğu için kurulamadı.
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200

lib_deps =
    lvgl/lvgl@9.2.2
    h2zero/NimBLE-Arduino@^2.1.0

; ui/ ve protocol/ src/ dışında olduğu için derlemeye ayrıca ekleniyor.
build_src_filter = +<*> +<../ui/> +<../protocol/>
build_flags =
    -DBOARD_HAS_PSRAM
    ; Type-C, CH343P USB-UART üzerinden UART0'a (GPIO43/44) bağlı; native USB yalnız
    ; 12 pinli konnektörde. CDC açık olursa Serial Type-C'de görünmez.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}/config
    -I${PROJECT_DIR}/ui
    -I${PROJECT_DIR}/protocol
